[package]
name = "espanso-detect"
version = "0.1.0"
authors = ["Federico Terzi <federico-terzi@users.noreply.github.com>"]
edition = "2021"
build = "build.rs"

[features]
# If the wayland feature is enabled, all X11 dependencies will be dropped
# and only EVDEV-based methods will be supported.
wayland = []

[dependencies]
espanso-info = { path = "../espanso-info" }
nix = { version = "0.29.0", features = ["socket", "ioctl"] }
log.workspace = true
lazycell.workspace = true
anyhow.workspace = true
thiserror.workspace = true
regex.workspace = true

[dev-dependencies]
enum-as-inner.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true

[target.'cfg(target_os="linux")'.dependencies]
wayland-client = "0.31.6"
libc = "0.2.85"
scopeguard = "1.1.0"

[build-dependencies]
cc.workspace = true
