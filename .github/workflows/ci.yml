name: CI

on:
  pull_request:
    paths-ignore:
      - ".devcontainer/**"
      - ".github/workflows/nix-build.yml"
      - ".github/workflows/update-flake.yml"
      - ".vscode/**"
      - "docs/**"
      - "images/**"
      - "schemas/**"
      - ".dockerignore"
      - ".editorconfig"
      - ".gitignore"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
      - "tarpaulin.toml"

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install Linux X11 dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            libdbus-1-dev \
            libssl-dev \
            libwxgtk3.*-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxtst-dev
      - name: Build
        run: |
          cargo build \
            --no-default-features \
            --features modulo,vendored-tls
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: espanso-linux-x11
          path: target/debug/espanso
      - name: Test
        run: |
          cargo test \
            --workspace \
            --exclude espanso-modulo \
            --exclude espanso-ipc \
            --no-default-features \
            --features vendored-tls
      - name: Clippy
        run: cargo clippy --all-targets --features=modulo,vendored-tls -- --deny warnings
      - uses: cachix/install-nix-action@v31
      - name: nix fmt
        run: nix fmt -- --check **/*.nix
      # This step fails to find `xcb/xcb.h`
      #
      #  xcb/xcb.h: No such file or directory
      # - name: nix build
      #   run: nix build

  linux-wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install Linux wayland dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            libdbus-1-dev \
            libssl-dev \
            libwxgtk3.*-dev \
            libxkbcommon-dev \
            wl-clipboard
      - name: Build
        run: |
          cargo build \
            --no-default-features \
            --features modulo,vendored-tls,wayland
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: espanso-linux-wayland
          path: target/debug/espanso
      - name: Test
        run: |
          cargo test \
            --workspace \
            --exclude espanso-modulo \
            --exclude espanso-ipc \
            --no-default-features \
            --features vendored-tls,wayland
      - name: Clippy
        run: cargo clippy --features=modulo,vendored-tls,wayland -- --deny warnings
      # leaving this nix because is quite fast. macOS in the other hand takes
      # an hour to complete
      - uses: cachix/install-nix-action@v31
      - name: nix build
        run: nix build .#espanso-wayland

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: |
          cargo build --target aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          cargo build --target x86_64-apple-darwin
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: espanso-macos
          path: |
            target/aarch64-apple-darwin/debug/espanso
            target/x86_64-apple-darwin/debug/espanso
      - name: Clippy
        run: |
          cargo clippy --target=aarch64-apple-darwin -- --deny warnings
          cargo clippy --target=x86_64-apple-darwin -- --deny warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/checkout@main
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: |
          cargo build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: espanso-windows
          path: target/debug/espanso.exe
      - name: Clippy
        run: cargo clippy -- --deny warnings
