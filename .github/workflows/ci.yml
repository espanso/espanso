name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - master
      - dev
      # TODO: remove this
      - ci-revamp
  pull_request:
    paths-ignore:
      - 'docs/**'

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux X11 dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            libdbus-1-dev \
            libssl-dev \
            libwxgtk3.*-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxtst-dev
      - name: build
        run: |
          cargo build \
            --no-default-features \
            --features modulo,vendored-tls
      - name: test
        run: |
          cargo test \
            --workspace \
            --exclude espanso-modulo \
            --exclude espanso-ipc \
            --no-default-features \
            --features vendored-tls
      - name: lint
        run: |
          cargo fmt --all -- --check
          cargo clippy -- -D warnings

  linux-wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux wayland dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            libdbus-1-dev \
            libssl-dev \
            libwxgtk3.*-dev \
            libxkbcommon-dev \
            wl-clipboard
      - name: build
        run: |
          cargo build \
            --no-default-features \
            --features modulo,vendored-tls,wayland
      - name: test
        run: |
          cargo test \
            --workspace \
            --exclude espanso-modulo \
            --exclude espanso-ipc \
            --no-default-features \
            --features vendored-tls,wayland
      - name: lint
        run: |
          cargo fmt --all -- --check
          cargo clippy -- -D warnings

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install target
        run: |
          rustup update
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        run: |
          cargo build --target aarch64-apple-darwin \
          cargo build --target x86_64-apple-darwin
      - name: lint
        run: |
          cargo fmt --all -- --check
          cargo clippy -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cargo build
      - name: lint
        run: |
          cargo fmt --all -- --check
          cargo clippy -- -D warnings
