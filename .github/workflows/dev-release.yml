name: Dev Release

on:
  push:
    paths-ignore:
      - '.devcontainer/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.vscode/**'
      - 'docs/**'
      - 'images/**'
      - 'schema/**'
      - 'README.md'
    branches:
      - dev
      # TODO: remove this
      - ci-revamp

defaults:
  run:
    shell: bash

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cargo build --release
      - name: Test
        run: |
          cargo test \
            --release \
            --workspace \
            --exclude espanso-modulo \
            --exclude espanso-ipc \
            --no-default-features \
            --features native-tls
      - name: Build resources
        run: ./scripts/build_windows_resources.sh release
      - name: Build installer
        run:  ./scripts/build_windows_installer.sh
      - name: Build portable mode archive 
        run: ./scripts/build_windows_portable.sh
      - name: Create portable mode archive
        shell: powershell
        run: |
          Rename-Item target/windows/portable espanso-portable
          Compress-Archive target/windows/espanso-portable target/windows/Espanso-Win-Portable-x86_64.zip
      - name: Calculate hashes
        shell: powershell
        run: |
          Get-FileHash target/windows/Espanso-Win-Portable-x86_64.zip -Algorithm SHA256 | select-object -ExpandProperty Hash > target/windows/Espanso-Win-Portable-x86_64.zip.sha256.txt
          Get-FileHash target/windows/installer/Espanso-Win-Installer-x86_64.exe -Algorithm SHA256 | select-object -ExpandProperty Hash > target/windows/installer/Espanso-Win-Installer-x86_64.exe.sha256.txt
      - uses: actions/upload-artifact@v4
        name: "Upload artifacts"
        with:
          name: Windows Artifacts
          path: |
            target/windows/installer/Espanso-Win-Installer-x86_64.exe
            target/windows/Espanso-Win-Portable-x86_64.zip
            target/windows/installer/Espanso-Win-Installer-x86_64.exe.sha256.txt
            target/windows/Espanso-Win-Portable-x86_64.zip.sha256.txt
  
  linux-x11:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev libdbus-1-dev libwxgtk3.2-dev
      - name: Build docker image
        run: |
          sudo docker build -t espanso-ubuntu . -f .github/scripts/Dockerfile
      - name: Build
        run: |
          cargo build \
            -p espanso \
            --release \
            --no-default-features \
            --features vendored-tls,modulo
      - name: Build AppImage
        run: |
          sudo docker run \
            --rm \
            -v "$(pwd):/shared" \
            espanso-ubuntu \
            espanso/.github/scripts/ubuntu/build_appimage.sh
      - uses: actions/upload-artifact@v4
        name: "Upload artifacts"
        with:
          name: Linux X11 Artifacts
          path: |
            Espanso-X11.AppImage
            Espanso-X11.AppImage.sha256.txt
  
  linux-deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev libdbus-1-dev libwxgtk3.2-dev
      - name: Build
        run: |
          cargo build \
            -p espanso \
            --release \
            --no-default-features \
            --features vendored-tls,modulo
      - name: Build docker image
        run: |
          sudo docker build -t espanso-ubuntu . -f .github/scripts/Dockerfile
      - name: Build Deb packages
        run: |
          sudo docker run --rm -v "$(pwd):/shared" espanso-ubuntu espanso/.github/scripts/ubuntu/build_deb.sh
      - uses: actions/upload-artifact@v4
        name: "Upload artifacts"
        with:
          name: Ubuntu-Debian Artifacts
          path: |
            espanso-debian-x11-amd64.deb
            espanso-debian-wayland-amd64.deb

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install rust target
        run: |
          rustup update
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test
        run: |
          cargo test \
            -p espanso \
            --target x86_64-apple-darwin \
            --no-default-features \
            --features native-tls,modulo
          cargo test \
            -p espanso \
            --target aarch64-apple-darwin \
            --no-default-features \
            --features native-tls,modulo
      - name: Build
        run: |
          cargo build \
            -p espanso \
            --target x86_64-apple-darwin \
            --release \
            --no-default-features \
            --features native-tls,modulo
          cargo build \
            -p espanso \
            --target aarch64-apple-darwin \
            --release \
            --no-default-features \
            --features native-tls,modulo
          bash ./scripts/create_bundle.sh
      - name: Create ZIP archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/mac/Espanso.app Espanso-Mac-Universal.zip
      - name: Calculate hashes
        run: |
          shasum -a 256 Espanso-Mac-Universal.zip > Espanso-Mac-Universal.zip.sha256.txt
      - uses: actions/upload-artifact@v4
        name: "Upload artifacts"
        with:
          name: MacOS Artifacts
          path: |
            Espanso-Mac-Universal.zip
            Espanso-Mac-Universal.zip.sha256.txt
