[workspace]
resolver = "2"

members = [
  "espanso",
  "espanso-detect",
  "espanso-ui",
  "espanso-inject",
  "espanso-ipc",
  "espanso-config",
  "espanso-match",
  "espanso-clipboard",
  "espanso-render",
  "espanso-info",
  "espanso-modulo",
  "espanso-mac-utils",
  "espanso-kvs",
  "espanso-engine",
  "espanso-package",
  "espanso-gui",
]

# === 编译速度优化 ===
# Debug 构建：减少调试信息加速编译，链接速度提升显著
[profile.dev]
debug = 1            # 仅行级调试信息（默认 2 会生成完整 debuginfo，链接极慢）
incremental = true   # 增量编译
codegen-units = 256  # 更多并行编译单元（默认 16）

# 对依赖包可以稍微优化以减少运行时开销（不影响编译速度）
[profile.dev.package."*"]
opt-level = 0        # 依赖也用 0，最快编译

# Release 构建（保持默认，只做编译速度优化）
[profile.release]
codegen-units = 16   # 默认 1，增加到 16 加速并行（略微牺牲运行时性能）
lto = false          # 关闭 LTO（默认），开发期间的 release 构建不需要

[workspace.lints.clippy]
enum_glob_use = "deny"
semicolon_if_nothing_returned = "deny"
wildcard_imports = "deny"

as_conversions = "allow"
borrow_as_ptr = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
no_effect_underscore_binding = "allow"
ptr_as_ptr = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
used_underscore_binding = "allow"

pedantic = { level = "warn", priority = -2 }

[workspace.dependencies]
anyhow = "1.0.38"
cc = "1.2.30"
chrono = { version = "0.4.41", features = ["unstable-locales"] }
chrono-tz = "0.10"
crossbeam = "0.8.0"
dirs = "3.0.1"
enum-as-inner = "0.6.0"
fs_extra = "1.3.0"
glob = "0.3.0"
lazycell = "1.3.0"
log = "0.4.14"
notify-rust = "4.11.7"
regex = "1.5.5"
serde = { version = "1.0.123", features = ["derive"] }
serde_json = "1.0.62"
serde_norway = "0.9.42"
tauri-winrt-notification = "0.7.2"
tempdir = "0.3.7"
thiserror = "1.0.23"
walkdir = "2.3.1"
widestring = "0.4.3"
windows = { version = "0.61.1", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Console",
] }
